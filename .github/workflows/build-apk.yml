name: Build APK

# Builds the debug APK on GitHub's runners (which can reach the Android SDK
# repository) and publishes it as a downloadable artifact. Runs on every push
# to the feature branch and can be launched manually from the Actions tab.
on:
  push:
    branches:
      - "claude/android-samsung-soundbar-app-h78cwh"
      - "main"
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: k650-remote-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # Publish a GitHub Release with a stable, direct download link.
      # - on a version tag (vX.Y.Z): release named after the tag;
      # - on a manual run (workflow_dispatch): release "v1.1" (tag created by the
      #   action itself, so no tag push is required).
      # A plain branch push does NOT create a release (avoids release spam).
      - name: Publish APK release
        if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v1.1' }}
          name: K650 Remote ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v1.1' }}
          body: |
            APK debug de K650 Remote, construit par CI.
            Télécharger **app-debug.apk** ci-dessous, transférer sur le téléphone
            et installer (autoriser les sources inconnues).
          files: app/build/outputs/apk/debug/app-debug.apk
          fail_on_unmatched_files: true
